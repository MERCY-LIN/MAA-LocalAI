name: LocalAI overlay validation

on:
  push:
    branches: [debug, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-overlay:
    runs-on: windows-latest
    steps:
      - name: Checkout overlay repository
        uses: actions/checkout@v4
        with:
          path: overlay-repo

      - name: Resolve base commit
        id: base
        shell: pwsh
        run: |
          $base = (Get-Content -Raw .\overlay-repo\BASE_COMMIT.txt).Trim()
          "commit=$base" >> $env:GITHUB_OUTPUT

      - name: Checkout MAA base
        uses: actions/checkout@v4
        with:
          repository: MaaAssistantArknights/MaaAssistantArknights
          ref: ${{ steps.base.outputs.commit }}
          path: maa-source

      - name: Apply verified overlay
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\overlay-repo\apply-overlay.ps1 `
            -TargetRepo ${{ github.workspace }}\maa-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Auto-Push test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\maa-source\tools\auto-push[dev]"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run Python tests
        shell: pwsh
        working-directory: maa-source
        run: |
          $python = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools\localai-workflow\localai.ps1 test-python `
            -Python $python

      - name: Run C# contract tests and WPF compile
        shell: pwsh
        working-directory: maa-source
        run: |
          $dotnet = (Get-Command dotnet).Source
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools\localai-workflow\localai.ps1 test-dotnet `
            -Dotnet $dotnet
